# Pre-commit for the Redstone Backport mod repository (submodule / standalone clone).
# Install: pre-commit install  (from this directory)

minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=102400"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: (?i)\.mf$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: (?i)\.mf$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
        files: \.py$
      - id: debug-statements
        files: \.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 6fec9b7edb08fd9989088709d864a7826dc74e80 # v0.15.12
    hooks:
      - id: ruff-format
        files: ^docs/.*\.pyi?$
      - id: ruff-check
        files: ^docs/.*\.pyi?$
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: d2823d321df3af8f878f7ee3414dc94d037145b9 # v2.1.0
    hooks:
      - id: mypy
        name: mypy (docs package)
        args: [--config-file=docs/pyproject.toml]
        files: ^docs/redstone_backport_docs/.*\.py$

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7 # v0.25
    hooks:
      - id: validate-pyproject
        files: .*pyproject\.toml$

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
    hooks:
      - id: codespell
        files: ^docs/
        exclude: ^docs/(_build|\.venv)/
        additional_dependencies: [tomli==2.5.0]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 996abf60411a8d954288ac9856aae7602b80cbda # v0.22.1
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (docs)
        language_version: "26.12.1"
        args: [--config, .markdownlint-cli2.yaml]
        files: ^docs/.*\.md$
        exclude: ^docs/(_build|\.venv)/

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: dependency-policy
        name: Dependency and workflow pin policy
        language: system
        entry: python3 -B scripts/check_dependency_policy.py
        pass_filenames: false
        always_run: true
      - id: vulture-docs-package
        name: vulture (docs package)
        language: python
        additional_dependencies: [vulture==2.16]
        pass_filenames: false
        files: ^docs/.*\.py$
        entry: vulture --min-confidence 80 docs/redstone_backport_docs
      - id: interrogate-docs-package
        name: interrogate (docs package)
        language: python
        additional_dependencies: [interrogate==1.7.0]
        pass_filenames: false
        files: ^docs/redstone_backport_docs/.*\.py$
        entry: interrogate -c docs/pyproject.toml docs/redstone_backport_docs

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce # v8.30.0
    hooks:
      - id: gitleaks
