name: Security

on:
  push:
    branches: [main]
    paths:
      - "**/*.gradle.kts"
      - ".github/dependabot.yml"
      - ".github/workflows/security.yml"
      - "gradle.properties"
      - "gradle.lockfile"
      - "gradle/**"
      - "pyproject.toml"
      - "docs/pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "**/*.gradle.kts"
      - ".github/dependabot.yml"
      - ".github/workflows/security.yml"
      - "gradle.properties"
      - "gradle.lockfile"
      - "gradle/**"
      - "pyproject.toml"
      - "docs/pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command

  gradle-dependency-graph:
    name: Generate locked Gradle dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Loom requires Java 21 to configure the build. The project modules
          # still compile against their explicitly declared Java 17 toolchains.
          java-version: "21"

      - name: Generate dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          dependency-graph: generate-and-upload

  gradle-dependency-submission:
    name: Submit locked Gradle dependency graph
    if: github.event_name != 'pull_request'
    needs: gradle-dependency-graph
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          dependency-graph: download-and-submit
